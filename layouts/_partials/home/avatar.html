{{ if and (isset .Site.Params "avatarurl") (not (isset .Site.Params "gravatar")) }}
  {{ with .Site.Params.avatarURL }}
    <div class="avatar">
      <picture>
        <source srcset="{{ replace . "profile.jpg" "profile.webp" | relURL }}" type="image/webp">
        <img src="{{ . | relURL }}" width="240" height="240" alt="Darragh Mahns" decoding="async">
      </picture>
    </div>
  {{ end }}
{{ end }}
{{ with .Site.Params.gravatar }}
  <div class="avatar"><img src="https://www.gravatar.com/avatar/{{md5 .}}?s=240&d=mp" alt="Darragh Mahns"></div>
{{ end }}
