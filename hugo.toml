baseURL = "https://darraghmahns.com"
title = "Darragh Mahns"
theme = "coder"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true

[pagination]
pagerSize = 10

# Keep taxonomy URLs out of the build; they added noise in Search Console without helping discovery.
disableKinds = ["taxonomy", "term"]

[sitemap]
changefreq = "weekly"
priority = 0.5

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
author = "Darragh Mahns"
description = "Forward deployed engineer in Missoula, MT. I build AI agents for non-technical companies and small businesses at Lattice Partners (AI consulting, not Lattice HR)."
keywords = "Darragh Mahns, forward deployed engineer, AI agents, Lattice Partners, Missoula, small business automation, technical consulting"
info = [
  "Forward Deployed Engineer @ [Lattice Partners](https://www.linkedin.com/company/lattice-partners)",
  "Missoula, MT. AI agents for teams that are not ready for them yet",
  "Bikes, running, and baking after 5",
]
images = ["/images/og-default.png"]
avatarURL = "images/profile.jpg"
dateFormat = "January 2, 2006"
since = 2020
colorScheme = "auto"
hideColorSchemeToggle = false
customCSS = ["css/site-logo.css", "css/home-layout.css"]
customSCSS = []
customJS = []

[params.seo]
ogImage = "/images/og-default.png"
twitterSite = "@_mahns"

[[params.social]]
name = "GitHub"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/darraghmahns"

[[params.social]]
name = "LinkedIn"
icon = "fa-brands fa-linkedin fa-2x"
weight = 2
url = "https://www.linkedin.com/in/darraghmahns"

[[params.social]]
name = "X"
icon = "fa-brands fa-x-twitter fa-2x"
weight = 3
url = "https://x.com/_mahns"

[[params.social]]
name = "Email"
icon = "fa-solid fa-envelope fa-2x"
weight = 4
url = "mailto:darraghmahns@gmail.com"

[taxonomies]
category = "categories"
tag = "tags"

[[menus.main]]
name = "About"
weight = 1
url = "about/"

[[menus.main]]
name = "Projects"
weight = 2
url = "projects/"

[[menus.main]]
name = "Blog"
weight = 3
url = "posts/"

[[menus.main]]
name = "Contact"
weight = 4
url = "contact/"