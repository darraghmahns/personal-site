name: Update GitHub Contributions

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch contributions via GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Calculate date range for last 365 days
          TO_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          FROM_DATE=$(date -u -v-365d +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -d "365 days ago" +"%Y-%m-%dT%H:%M:%SZ")

          QUERY='query($userName: String!, $from: DateTime!, $to: DateTime!) { user(login: $userName) { contributionsCollection(from: $from, to: $to) { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount } } } } } }'

          curl -H "Authorization: bearer $GITHUB_TOKEN" \
               -X POST \
               -d "{\"query\": \"$QUERY\", \"variables\": {\"userName\": \"darraghmahns\", \"from\": \"$FROM_DATE\", \"to\": \"$TO_DATE\"}}" \
               https://api.github.com/graphql \
               | jq '.data.user.contributionsCollection.contributionCalendar' \
               > public/contributions.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/contributions.json
          git diff --staged --quiet || git commit -m "Update GitHub contributions data [skip ci]"
          git push
